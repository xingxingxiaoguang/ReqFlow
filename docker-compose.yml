services:
  postgres:
    # 中文全文检索：默认镜像无中文分词（fts.ts_config=simple 按空白切词）。
    # 需要 zhparser/pg_jieba 时换成含扩展的镜像（如 abcfy2/zhparser:pg16 或自建 Dockerfile），
    # 并把 config.yaml 的 fts.ts_config 改为 zhparser 等对应配置名。
    image: pgvector/pgvector:pg16
    container_name: reqflow-pg
    environment:
      POSTGRES_USER: reqflow
      POSTGRES_PASSWORD: reqflow
      POSTGRES_DB: reqflow
    ports:
      - "5432:5432"
    volumes:
      - reqflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    # 仅用于本地开发；生产环境必须启用认证和 TLS。
    image: opensearchproject/opensearch:3.8.0
    container_name: reqflow-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - reqflow_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  reqflow_pgdata:
  reqflow_opensearch_data:
