services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reqflow-pg
    environment:
      POSTGRES_USER: reqflow
      POSTGRES_PASSWORD: reqflow
      POSTGRES_DB: reqflow
    ports:
      - "5432:5432"
    volumes:
      - reqflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reqflow_pgdata:
