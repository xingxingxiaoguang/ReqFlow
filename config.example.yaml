# ReqFlow 配置文件
# 复制为 config.yaml 后填写；环境变量（REQFLOW_ 前缀，全大写、层级用 _ 连接）可覆盖文件值。
# 加载优先级：-config 指定路径 > $REQFLOW_CONFIG > ./config.yaml

server:
  port: 8080
  log_level: info        # debug | info | warn | error
  log_format: text       # text | json

database:
  dsn: postgres://reqflow:reqflow@127.0.0.1:5432/reqflow?sslmode=disable
  auto_migrate: true     # 启动时自动执行内嵌迁移
  retry_count: 5
  retry_interval_ms: 2000

# 持久化流程任务 Worker。每个并发槽同一时刻执行一个流程步骤；多实例可继续水平扩展。
worker:
  concurrency: 6        # 单实例同时执行的最大步骤数
  lease_seconds: 30     # 执行权租约，运行期间会自动续租
  poll_interval_ms: 500
  recovery_interval_ms: 5000
  reconcile_limit: 100

# LLM 协议（provider: openai = OpenAI 兼容 /chat/completions，DeepSeek / GLM / Qwen / Kimi
# 等均适用，默认；anthropic = Anthropic Messages 协议）
llm:
  provider: openai
  base_url: https://api.deepseek.com/v1
  api_key: ""
  model: deepseek-chat
  temperature: 0.9
  max_tokens: 128000
  timeout_ms: 600000
  agent_mode: false     # true 时需求分析启用 agent loop：模型经工具自主工作——
                       # read_document 分批阅读 / search_document 检索定位 /
                       # write_work_items 分批产出草稿 / ask_human 关键决策点问人
                       # （草稿落库仍需人工确认）
  agent_max_iterations: 32  # agent loop 迭代上限（分批阅读大文档需多轮）

# 向量 embedding（OpenAI 兼容 /embeddings；不配置则语义匹配自动降级为仅精确匹配）
embedding:
  base_url: https://api.siliconflow.cn/v1
  api_key: ""
  model: BAAI/bge-m3
  dimensions: 1024      # 第一波向量列固定 1024 维，如需其它维度须调整迁移
  batch_size: 32
  timeout_ms: 30000
  rerank_model: BAAI/bge-reranker-v2-m3  # 与 embedding 复用 base_url / api_key
  rerank_timeout_ms: 60000

# RetrievalProfile 的 BM25 物理后端。本地 docker-compose 默认关闭安全插件。
opensearch:
  base_url: http://127.0.0.1:9200
  username: ""
  password: ""
  index_prefix: reqflow
  timeout_ms: 30000

match:
  duplicate_threshold: 0.75   # 查重相似度阈值，低于视为新工作项

fts:
  ts_config: simple           # PG 全文检索分词配置（索引与查询两侧共用）。
                              # simple 按空白切词（中文不分词）；中文全文检索需安装
                              # zhparser / pg_jieba 扩展后改为对应配置名（见 docker-compose 注释）

parser:
  max_file_mb: 200
  mineru:
    enabled: true             # false 时上传 PDF 直接报不支持
    api_url: https://mineru.net
    api_token: ""
    model_version: vlm        # vlm(MinerU 2.5) | pipeline
    timeout_ms: 600000
    poll_interval_ms: 5000

# 预留：第二波 OAuth 用户授权令牌入库时的字段加密密钥（64 位 hex = 32 字节）
security:
  encryption_key: ""

workspace:
  name: ReqFlow
  upload_dir: ./data/uploads    # 上传文件暂存目录
  demand_dir: ./data/demands    # 分析原文存档目录
  blob_dir: ./data/blobs        # V2 不可变原始资产（内容寻址 BlobStore）
